      <line x1="-88" y1="35" x2="88" y2="35"/>
      <line x1="-88" y1="112" x2="40" y2="112"/></g>
      <g stroke="url(#ink)">
      <path d="M-160,-185 L60,-185 L160,-85 L160,185 L-160,185 Z"/>
      <polyline points="60,-185 60,-85 160,-85"/>
      <line x1="-88" y1="35" x2="88" y2="35"/>
      <line x1="-88" y1="112" x2="40" y2="112"/></g>
