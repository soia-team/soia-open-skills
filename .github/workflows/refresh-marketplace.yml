name: Refresh Marketplace Pins

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 00:00（北京 08:00）
  workflow_dispatch:       # 支持手动触发

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Regenerate marketplace manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/generate_marketplaces.py
          python3 scripts/generate_routing_manifest.py
          python3 scripts/generate_router_index.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(marketplace): auto-refresh sha pins"
            git push
            echo "已刷新并提交"
          else
            echo "清单已是最新，无需提交"
          fi
